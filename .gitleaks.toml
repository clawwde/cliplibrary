title = "cliplibrary gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Ignore generated, vendored and build-output directories"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)\.next/''',
  '''(^|/)\.turbo/''',
  '''(^|/)dist/''',
  '''(^|/)build/''',
  '''(^|/)coverage/''',
  '''(^|/)playwright-report/''',
  '''(^|/)test-results/''',
  '''(^|/)bun\.lock$''',
]
