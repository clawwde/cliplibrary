config:
  default: true
  MD013: false
  MD024:
    siblings_only: true
  MD033:
    allowed_elements:
      - img
      - br
      - details
      - summary
      - kbd
      - div
  MD041: false

globs:
  - "**/*.md"

ignores:
  - "**/node_modules/**"
  - "**/.next/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/coverage/**"
  - "**/playwright-report/**"
  - "**/test-results/**"
